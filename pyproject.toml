[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flowguard"
version = "0.1.0"
description = "A local-first workflow automation engine — a lightweight, deterministic alternative to CI/CD pipelines for individual developers and small teams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "FlowGuard Contributors" }]
keywords = [
    "workflow",
    "automation",
    "pipeline",
    "ci",
    "local",
    "developer-tools",
    "task-runner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/flowguard/flowguard"
Documentation = "https://github.com/flowguard/flowguard#readme"
Changelog = "https://github.com/flowguard/flowguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/flowguard/flowguard/issues"

[project.scripts]
flowguard = "flowguard.cli.commands:app"

[project.entry-points."flowguard.plugins"]
# Third-party plugins register hooks here, e.g.:
# myplugin = "myplugin.flowguard:MyPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/flowguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"] # nested with in tests is fine
# The Plugin interface deliberately keeps every hook optional: an empty
# subclass is a valid minimal plugin, so no hook is abstract.
"src/flowguard/plugins/base.py" = ["B024", "B027"]

[tool.ruff.format]
quote-style = "double"
